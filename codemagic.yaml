workflows:
  ios-release:
    name: JASPR Market iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jasprtrading.jasprmarket
      vars:
        BUNDLE_ID: "com.jasprtrading.jasprmarket"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22.0.0
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build React app
        script: CI=false npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -type f
          cd ios/App
          pod init
          cat Podfile
          pod install
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
